<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASY REFEREE - Acceso</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { text-align: center; max-width: 500px; width: 100%; }
  .logo { width: 180px; max-width: 70%; margin-bottom: 5px; }
  h1 { font-size: 48px; font-weight: 900; letter-spacing: 2px; color: #000; line-height: 1; }
  h2 { font-size: 14px; font-weight: 700; letter-spacing: 4px; color: #e11d2e; margin-top: 5px; margin-bottom: 25px; }
  .box { background: #f5f5f5; border: 2px solid #000; border-radius: 15px; padding: 25px; }
  .box label { display: block; font-weight: 800; font-size: 14px; letter-spacing: 1px; margin-bottom: 12px; }
  input, select { width: 100%; padding: 15px; font-size: 16px; text-align: center; border: 2px solid #000; border-radius: 10px; outline: none; margin-bottom: 15px; }
  input:focus { border-color: #e11d2e; }
  button { width: 100%; padding: 15px; font-size: 18px; font-weight: 900; letter-spacing: 2px; background: #000; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
  button:hover { background: #e11d2e; }
  .btn-sec { background: #fff; color: #000; border: 2px solid #000; font-size: 14px; padding: 12px; }
  .btn-sec:hover { background: #000; color: #fff; }
  #error { color: #e11d2e; font-weight: 700; font-size: 14px; margin-top: 5px; display: none; }
  .footer { margin-top: 25px; font-size: 13px; line-height: 1.6; color: #555; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-box { background: #fff; width: 100%; max-width: 400px; border-radius: 15px; padding: 25px; text-align: center; }
  .modal-box h3 { margin-bottom: 15px; }
</style>
</head>
<body>
<div class="container">
  <img src="logo2.png" alt="EASY REFEREE" class="logo" id="logoImg" onerror="probarLogo(this)">
  <p id="avisoLogo" style="display:none; font-size:12px; color:#e11d2e; font-weight:700; margin-bottom:10px;">⚠️ NO SE ENCONTRÓ EL LOGO - Guarda la imagen como logo2.png en la misma carpeta que este archivo</p>

  <h1>EASY REFEREE</h1>
  <h2>BODYBUILDING & FITNESS JUDGING SYSTEM</h2>

  <div class="box">
    <label>INGRESA LA CONTRASEÑA PARA ENTRAR</label>
    <input type="password" id="pass" placeholder="••••" onkeydown="if(event.key==='Enter') entrar()">
    <button onclick="entrar()">ENTRAR</button>
    <button class="btn-sec" onclick="abrirCambio()">CAMBIAR CONTRASEÑA</button>
    <p id="error">❌ CONTRASEÑA INCORRECTA</p>
  </div>

  <p class="footer">
    Desarrollado por Fernando A. Arriaga creador y propietario.<br>
    © 2026 EASY REFEREE
  </p>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3>CAMBIAR CONTRASEÑA</h3>
    <input type="password" id="actual" placeholder="Contraseña actual">
    <input type="password" id="nueva" placeholder="Nueva contraseña">
    <input type="password" id="confirmar" placeholder="Repetir nueva contraseña">
    <button onclick="cambiarPass()">GUARDAR NUEVA CONTRASEÑA</button>
    <button class="btn-sec" onclick="cerrarCambio()">CANCELAR</button>
    <p id="msgCambio" style="font-size:13px;margin-top:10px;"></p>
  </div>
</div>

<script>
const nombresLogo = ["logo2.png", "logo2.jpg", "logo2.jpeg", "logo2.webp"];
let intentoLogo = 0;
function probarLogo(img){
  intentoLogo++;
  if(intentoLogo < nombresLogo.length){ img.src = nombresLogo[intentoLogo]; }
  else { img.style.display = "none"; document.getElementById('avisoLogo').style.display = "block"; }
}
function getPass(){ return localStorage.getItem('easy_referee_pass') || "NOANOA2023"; }
function entrar(){
  const pass = document.getElementById('pass').value;
  const error = document.getElementById('error');
  if(pass === getPass()){
    window.location.href = "configuracion.html";
  } else {
    error.style.display = "block";
    document.getElementById('pass').value = "";
  }
}
function abrirCambio(){ document.getElementById('modal').classList.add('open'); }
function cerrarCambio(){ document.getElementById('modal').classList.remove('open'); document.getElementById('msgCambio').textContent=""; }
function cambiarPass(){
  const actual = document.getElementById('actual').value;
  const nueva = document.getElementById('nueva').value;
  const confirmar = document.getElementById('confirmar').value;
  const msg = document.getElementById('msgCambio');
  if(actual !== getPass()){ msg.style.color="red"; msg.textContent="❌ La contraseña actual no es correcta"; return; }
  if(!nueva || nueva.length < 4){ msg.style.color="red"; msg.textContent="❌ La nueva contraseña debe tener mínimo 4 caracteres"; return; }
  if(nueva !== confirmar){ msg.style.color="red"; msg.textContent="❌ Las nuevas contraseñas no coinciden"; return; }
  localStorage.setItem('easy_referee_pass', nueva);
  msg.style.color="green"; msg.textContent="✅ Contraseña cambiada con éxito";
  setTimeout(cerrarCambio, 1200);
}
</script>
</body>
</html>
